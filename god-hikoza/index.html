<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080d1d"><title>ゴッドヒコザVSフデガキ星人</title><link rel="stylesheet" href="style.css"></head><body><main><header><a href="../">ARCADE / 01</a><span>GOD HIKOZA <i>VS</i> FUDEGAKI</span><div><button id="sound" aria-label="音声切替">音 ON</button><button id="pause">一時停止</button><button id="full" aria-label="全画面">⛶</button></div></header><section id="arena"><canvas id="game" width="640" height="360" aria-label="ゴッドヒコザ対フデガキ星人の格闘ゲーム"></canvas><div id="overlay"></div><div id="loading">スプライトを読み込み中…</div></section><section id="controls" aria-label="操作パネル"><div class="pad"><button data-key="ArrowUp" class="up" aria-label="ジャンプ">▲</button><button data-key="ArrowLeft" class="left" aria-label="左へ">◀</button><span>MOVE</span><button data-key="ArrowRight" class="right" aria-label="右へ">▶</button><button data-key="ArrowDown" class="down" aria-label="しゃがみ">▼</button></div><div class="actions"><button data-key="z">弱 P<small>Z</small></button><button data-key="x">強 P<small>X</small></button><button data-key="c" class="guard">ガード<small>C</small></button><button data-key="a">弱 K<small>A</small></button><button data-key="s">強 K<small>S</small></button><button data-key="v" id="special">必殺技<small>V / LOCKED</small></button></div></section><footer><span>矢印キー：移動・ジャンプ・しゃがみ　/　ESC：一時停止</span><span>30 / 60 DAMAGE → ITEM → SPECIAL</span></footer></main><script src="engine.js"></script><script src="game.js"></script></body></html>
