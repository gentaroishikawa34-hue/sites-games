<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#bd392f"><meta name="description" content="景品を設定して、みんなで福引！開催途中の景品追加・補充に対応する、ガラポン抽選と引換管理アプリ。"><title>ふくびきメーカー｜景品を設定して、みんなで福引！</title><style>:root{--red:#bd392f;--ink:#352d27;--muted:#80756b;--cream:#fbf7ed;--gold:#bf9450;--line:#e8dfd1;--green:#4d7560}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:'Hiragino Kaku Gothic ProN','Yu Gothic',Meiryo,sans-serif;font-size:14px}button,input,select,textarea{font:inherit}button,a{touch-action:manipulation}button{cursor:pointer;border:1px solid var(--line);border-radius:9px;min-height:44px;padding:11px 18px;background:#fff;color:var(--ink);font-weight:700;transition:background .2s,transform .2s}button:hover{background:#f2ebe0}button:active{transform:translateY(1px)}button:disabled{opacity:.45;cursor:not-allowed}button.primary{background:var(--red);color:white;border-color:var(--red);box-shadow:0 3px 0 #922c25}button.primary:hover{background:#a92e26}button.dark{background:var(--ink);color:#fff;border-color:var(--ink)}button.ghost{background:transparent;border-color:transparent;color:var(--muted)}button.small{padding:7px 12px;min-height:36px;font-size:12px}.danger{color:#b6302b}h1,h2,h3,p{margin-top:0}h1,h2,.serif{font-family:'Yu Mincho','Hiragino Mincho ProN',serif}h1{font-size:clamp(32px,4.2vw,56px);letter-spacing:.06em;line-height:1.35}h2{font-size:28px;letter-spacing:.04em}h3{font-size:16px}p{line-height:1.8}.muted{color:var(--muted)}.eyebrow{font-size:11px;letter-spacing:.17em;font-weight:bold;color:var(--red);margin-bottom:18px}.badge{display:inline-flex;align-items:center;gap:6px;border-radius:30px;padding:6px 11px;font-size:11px;background:#eee9dc;white-space:nowrap}.badge.green{background:#e6eee7;color:#466950}.badge.red{background:#f7e2de;color:var(--red)}.dot{width:7px;height:7px;border-radius:50%;background:current at center,#fffdf6aa,transparent 70%)}.play-top{width:100%;display:flex;justify-content:space-between;align-items:center;color:#937e63;max-width:950px;flex-shrink:0;font-size:12px}.play-title{font-size:clamp(21px,4vw,36px);margin:14px 0 0}.play-title-image{max-height:65px;max-width:180px;object-fit:contain}.play-art{min-height:0;flex:1;width:min(640px,90vw);display:flex;align-items:center;justify-content:center;position:relative}.machine{width:100%;max-width:500px;max-height:100%;overflow:visible;filter:drop-shadow(0 16px 18px #60422414)}.play-art .machine{height:100%;width:100%;max-height:460px}.play-go{font-size:clamp(18px,3vw,26px);width:min(410px,90vw);min-height:62px;flex-shrink:0;letter-spacing:.07em}.play-note{font-size:12px;color:#917c63;margin:16px 0 4px;flex-shrink:0}.spin .drum{transform-origin:240px 175px;animation:rotateDrum 3.2s cubic-bezier(.42,0,.22,1) both}.spin .handle{transform-origin:371px 182px;animation:rotateDrum 3.2s cubic-bezier(.42,0,.22,1) both}.spin .machine{animation:shake .13s 10 1.2s}.rolling-ball{opacity:0;transform-origin:350px 280px}.spin .rolling-ball{animation:ballDrop 1.8s 3s both}.result{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;min-height:0;width:100%;position:relative;isolation:isolate}.result.luxury:before{content:'';position:absolute;inset:0;background:repeating-conic-gradient(from 10deg,#ebc26222 0deg 12deg,transparent 12deg 24deg);z-index:-1;border-radius:50%;animation:slowturn 35s linear infinite}.result h2{font-size:clamp(23px,5vw,45px);color:var(--red);margin:8px 0}.result h3{font-size:clamp(22px,4vw,38px);margin:8px 0}.result .result-img{height:clamp(70px,19dvh,160px);max-width:75vw;object-fit:contain}.result svg.result-img{width:140px}.result p{margin:5px 0;max-height:13dvh;overflow:auto}.result .result-grade{font-size:clamp(28px,6vw,64px);font-family:serif;font-weight:bold;color:#9b742e}.result-number{font-size:11px;color:var(--muted);margin:10px}.confetti{position:absolute;top:0;width:8px;height:15px;background:var(--gold);animation:fall 3.5s linear infinite;pointer-events:none;z-index:-1}.staffpanel{max-width:700px;margin:auto}.drawbadge{font-size:12px;margin-bottom:14px;color:var(--muted)}dialog{border:1px solid var(--line);border-radius:16px;width:min(620px,94vw);max-height:90dvh;padding:26px;background:#fffdf8;color:var(--ink);box-shadow:0 20px 100px #30211733}dialog::backdrop{background:#31251c77;backdrop-filter:blur(3px)}dialog h2{font-family:inherit;font-size:21px}dialog .actions{margin-top:22px;justify-content:flex-end}.modalclose{float:right;padding:3px 10px;min-height:32px;font-size:20px}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);padding:14px 24px;background:var(--ink);color:white;z-index:999;border-radius:10px;box-shadow:0 5px 20px #0002;max-width:90vw;text-align:center}.error{color:#b72d22;font-size:13px;line-height:1.8;white-space:pre-line}.report{display:grid;grid-template-columns:1fr 1fr;gap:20px}details summary{cursor:pointer;padding:10px 0;color:var(--muted)}pre{white-space:pre-wrap;word-break:break-all;font-size:11px;max-height:260px;overflow:auto}.progress-ring{width:100%;height:1px;background:var(--line)}:focus-visible{outline:3px solid #b68e50;outline-offset:3px}@keyframes rotateDrum{to{transform:rotate(1440deg)}}@keyframes shake{50%{transform:translate(1.5px,-1px)}}@keyframes ballDrop{0%{opacity:0;transform:translate(-15px,-38px) scale(.6)}10%{opacity:1}45%{transform:translate(10px,22px) scale(1)}65%{transform:translate(23px,5px) scale(1)}80%{transform:translate(25px,22px) scale(1)}100%{opacity:1;transform:translate(25px,15px) scale(2)}}@keyframes slowturn{to{transform:rotate(360deg)}}@keyframes fall{0%{transform:translateY(-15px) rotate(0);opacity:0}10%{opacity:1}100%{transform:translateY(65dvh) rotate(400deg);opacity:0}}@media(max-width:720px){.header{height:65px;padding:0 16px}.brand{font-size:16px;gap:8px}.header-actions .badge{display:none}.wrap{padding:24px 17px 40px}.hero{grid-template-columns:1fr;gap:4px;padding:14px 0 18px}.hero h1{font-size:38px;margin-bottom:10px}.hero p{font-size:13px;margin-bottom:18px}.hero .lead{font-size:16px}.hero-art{min-height:265px;grid-row:2}.hero-art .machine{max-height:270px;width:330px}.hero-art:before{width:235px;height:235px}.hero-art:after{right:8%;width:48px;height:48px;font-size:24px}.hero-caption{bottom:0;font-size:10px}.steps{grid-template-columns:1fr;gap:18px;margin-top:28px}.empty{flex-direction:column;align-items:flex-start;padding:20px}.stats{grid-template-columns:repeat(2,1fr);gap:10px}.stat{padding:14px}.topline{flex-direction:column}.formgrid{grid-template-columns:1fr}.report{grid-template-columns:1fr}.card{padding:20px}.prizegrid{grid-template-columns:1fr}.chartrow{grid-template-columns:105px 1fr 35px}.play{padding-top:12px}.play-title{margin-top:8px}.play-go{min-height:58px}.play-note{margin-top:12px}.header-actions button{font-size:11px;padding:8px}.result h2{margin:4px 0}.result h3{margin:5px 0}.result-number{margin:5px}}@media(max-height:550px){.play-title{font-size:18px}.play-go{min-height:44px;font-size:18px}.play-note{margin:7px 0;font-size:10px}.play-top button{min-height:30px}.result .result-img{height:65px}.result .result-grade{font-size:28px}.result h3{font-size:22px}.result h2{font-size:22px}.play-title-image{display:none}}@media(prefers-reduced-motion:reduce){.spin .drum,.spin .handle{animation-duration:.2s}.spin .machine{animation:none}.confetti,.result.luxury:before{animation:none}.spin .rolling-ball{animation-duration:.2s;animation-delay:3s}}
</style></head><body><div id="app"><p style="padding:40px">ふくびきメーカーを準備しています…</p></div><dialog id="modal"></dialog><div id="toast" class="toast" hidden role="status" aria-live="polite"></div><noscript>この福引にはJavaScriptが必要です。</noscript><script>const Engine = (() => {
  const clone = x => structuredClone(x);
  const id = () => crypto.randomUUID();
  const now = () => new Date().toISOString();
  const count = n => { if (!Number.isSafeInteger(n) || n < 0 || n > 1000000) throw Error('本数は0〜1,000,000の整数で入力してください。'); return n; };
  const live = e => e.prizes.filter(p => p.enabled && !p.hidden && p.remaining > 0);
  const total = e => live(e).reduce((s,p)=>s+p.remaining,0);
  function uniform(n) { const max=4294967296, limit=max-max%n, a=new Uint32Array(1); do {crypto.getRandomValues(a);} while(a[0]>=limit); return a[0]%n; }
  function log(e, type, prizeId, before, after, reason='') { e.changes.push({id:id(),eventId:e.id,prizeId,time:now(),type,before:clone(before),after:clone(after),reason}); }
  function prize(data, order=0) { return {id:id(),grade:'',name:'',description:'',image:'',initial:0,remaining:0,won:0,color:'#df453a',rank:'normal',order,enabled:true,hidden:false,...data}; }
  function sample() { return [['特賞','豪華ギフトセット',1,'#d4a33d','luxury'],['1等','商品券5,000円',3,'#d7473c','luxury'],['2等','お菓子詰め合わせ',10,'#457cbd','normal'],['3等','ドリンク無料券',30,'#498865','normal'],['参加賞','ポケットティッシュ',56,'#ffffff','simple']].map((a,i)=>prize({grade:a[0],name:a[1],initial:a[2],remaining:a[2],color:a[3],rank:a[4]},i)); }
  function event(data, prizes=sample()) {return {id:id(),name:'新しい福引',date:new Date().toLocaleDateString('sv-SE'),organizer:'',description:'',background:'#fbf7ed',image:'',sound:true,status:'準備中',pin:null,prizes,draws:[],changes:[],exchanges:[],pending:null,allowed:false,started:null,created:now(),...data};}
  function draw(e) { if(e.status!=='開催中'||!e.allowed||e.pending) throw Error('スタッフによる抽選許可が必要です。'); let n=total(e);if(!n)throw Error('抽選できる景品がありません。');let r=uniform(n),p;for(const x of live(e)){if(r<x.remaining){p=x;break;}r-=x.remaining;}p.remaining--;p.won++;const d={id:id(),eventId:e.id,number:e.draws.length+1,time:now(),prizeId:p.id,snapshot:clone(p),exchange:'未引換',exchangeAt:null,void:false,voidReason:'',restored:false};e.draws.push(d);e.pending=d.id;e.allowed=false;return d; }
  function settle(e,drawId,kind,restore=false,reason='') {const d=e.draws.find(x=>x.id===drawId);if(!d||d.void)throw Error('有効な抽選が見つかりません。');if(kind==='取消'){if(!reason.trim())throw Error('取消理由を入力してください。');d.void=true;d.voidReason=reason;}else{if(d.exchange!=='未引換')throw Error('引換処理済みです。');if(!['引換済み','辞退'].includes(kind))throw Error('引換操作が不正です。');d.exchange=kind;d.exchangeAt=now();}if(restore&&!d.restored){const p=e.prizes.find(x=>x.id===d.prizeId);if(!p)throw Error('景品が見つかりません。');count(p.remaining+1);p.remaining++;d.restored=true;}e.exchanges.push({id:id(),drawId,eventId:e.id,time:now(),kind,restore,reason}); }
  function permit(e){const d=e.draws.find(x=>x.id===e.pending);if(d&&d.exchange==='未引換'&&!d.void)throw Error('先に景品引換完了または引換辞退を選んでください。');e.pending=null;e.allowed=false;if(!total(e)){e.status=e.prizes.some(p=>!p.hidden&&p.remaining>0)?'一時停止':'終了';return;}e.status='開催中';e.allowed=true;if(!e.started)e.started=now();}
  function editPrize(e,pid,values,reason=''){let p=e.prizes.find(x=>x.id===pid);const old=p?clone(p):null;if(!p){if(e.prizes.filter(x=>!x.hidden).length>=30)throw Error('景品は最大30種類です。');p=prize({},e.prizes.length);}if(!String(values.name||'').trim())throw Error('景品名を入力してください。');count(values.remaining);const protectedFields={id:p.id,initial:old?p.initial:values.remaining,won:p.won,hidden:p.hidden};Object.assign(p,values,protectedFields);if(!old)e.prizes.push(p);log(e,old?'編集':'追加',p.id,old,p,reason);return p;}
  function removePrize(e,pid){const p=e.prizes.find(x=>x.id===pid);if(!p)throw Error('景品がありません。');const before=clone(p);if(e.draws.some(d=>d.prizeId===pid)){p.hidden=true;p.enabled=false;}else e.prizes=e.prizes.filter(x=>x.id!==pid);log(e,'削除・無効化',pid,before,p.hidden?p:null);}
  function duplicate(e){return event({name:e.name+'（コピー）',organizer:e.organizer,description:e.description,background:e.background,image:e.image,sound:e.sound,pin:clone(e.pin)},e.prizes.filter(p=>!p.hidden).map((p,i)=>prize({...clone(p),id:id(),remaining:p.initial,won:0,hidden:false},i)));}
  function imageValid(s){return s===''||(typeof s==='string'&&s.length<1500000&&/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(s));}
  function validate(s){if(!s||s.version!==1||!Array.isArray(s.events)||s.events.length>200)throw Error('対応していないバックアップ形式です。');const ids=new Set();const string=(v,n=2000)=>typeof v==='string'&&v.length<=n;const date=v=>v===null||(typeof v==='string'&&Number.isFinite(Date.parse(v)));for(const e of s.events){if(!string(e.id)||ids.has(e.id)||!string(e.name,120)||!e.name.trim()||!['準備中','開催中','一時停止','終了'].includes(e.status)||typeof e.allowed!=='boolean'||!Array.isArray(e.prizes)||!Array.isArray(e.draws)||!Array.isArray(e.changes)||!Array.isArray(e.exchanges)||e.prizes.filter(p=>!p.hidden).length>30||!imageValid(e.image)||!/^#[\da-f]{6}$/i.test(e.background)||!string(e.description)||!string(e.organizer,120)||!string(e.date,30)||typeof e.sound!=='boolean'||!date(e.created)||!date(e.started)||!e.pin||!/^([\da-f]{2}){16}$/.test(e.pin.salt)||!/^([\da-f]{2}){32}$/.test(e.pin.hash))throw Error('イベント設定に不整合があります。');ids.add(e.id);const ps=new Set();for(const p of e.prizes){if(!string(p.id)||ps.has(p.id)||!string(p.name,120)||!p.name.trim()||!string(p.grade,30)||!string(p.description)||!imageValid(p.image)||!/^#[\da-f]{6}$/i.test(p.color)||!['luxury','normal','simple'].includes(p.rank)||typeof p.enabled!=='boolean'||typeof p.hidden!=='boolean'||!Number.isSafeInteger(p.order))throw Error('景品データに不整合があります。');count(p.remaining);count(p.initial);if(!Number.isSafeInteger(p.won)||p.won<0)throw Error('当選数が不正です。');ps.add(p.id);}const ds=new Set();for(const [i,d] of e.draws.entries()){if(!string(d.id)||ds.has(d.id)||!ps.has(d.prizeId)||d.eventId!==e.id||d.number!==i+1||!d.snapshot||!string(d.snapshot.name,120)||!string(d.snapshot.grade,30)||!string(d.snapshot.description)||!/^#[\da-f]{6}$/i.test(d.snapshot.color)||!['luxury','normal','simple'].includes(d.snapshot.rank)||!imageValid(d.snapshot.image)||!date(d.time)||!date(d.exchangeAt)||!['未引換','引換済み','辞退'].includes(d.exchange)||typeof d.void!=='boolean'||typeof d.restored!=='boolean'||!string(d.voidReason))throw Error('抽選履歴に不整合があります。');ds.add function historyView(e){return `<div class="sectionbar"><h2>抽選履歴</h2>${btn('CSVを書き出す','csv-draw','small')}</div><div class="filter"><input id="search-history" placeholder="景品名・等級・抽選番号で検索" aria-label="履歴検索"><select id="filter-history" aria-label="引換状態"><option>すべて</option><option>未引換</option><option>引換済み</option><option>辞退</option><option>取消</option></select></div><div class="tablebox"><table><thead><tr><th>番号 / 日時</th><th>当選時の景品</th><th>状態</th><th>操作</th></tr></thead><tbody id="history-body">${historyRows(e)}</tbody></table></div>`;}
function historyRows(e){const q=($('#search-history')?.value||'').toLowerCase(),f=$('#filter-history')?.value||'すべて';return e.draws.slice().reverse().filter(d=>(`${d.number} ${d.snapshot.name} ${d.snapshot.grade}`).toLowerCase().includes(q)&&(f==='すべて'||(f==='取消'?d.void:!d.void&&d.exchange===f))).map(d=>`<tr><td><b>#${String(d.number).padStart(4,'0')}</b><br>${fmt(d.time)}<details><summary>ID</summary>${esc(d.id)}</details></td><td><div class="prizehead" style="margin:0">${imageTag(d.snapshot)}<div><i class="ball" style="background:${d.snapshot.color}"></i>${esc(d.snapshot.grade)}<p>${esc(d.snapshot.name)}</p></div></div></td><td>${d.void?'取消':esc(d.exchange)}${d.restored?'<br>在庫復元済み':''}<br><small>${fmt(d.exchangeAt)}</small>${d.void?`<p>${esc(d.voidReason)}</p>`:''}</td><td>${!d.void&&d.exchange==='未引換'?btn('引換確認','staff','small'):''}${!d.void?btn('取り消す','void','small danger',`data-id="${d.id}"`):''}</td></tr>`).join('')||'<tr><td colspan="4">該当する抽選はありません。</td></tr>';}
function changesView(e){return `<div class="sectionbar"><h2>景品変更履歴</h2>${btn('CSVを書き出す','csv-change','small')}</div><div class="tablebox"><table><thead><tr><th>日時</th><th>操作</th><th>景品 / 変更内容</th></tr></thead><tbody>${e.changes.slice().reverse().map(c=>`<tr><td>${fmt(c.time)}</td><td>${esc(c.type)}</td><td>${esc(c.after?.name||c.before?.name||'イベント')}<br>${esc(c.reason)}<details><summary>変更前・変更後</summary><pre>${esc(JSON.stringify({変更前:summarySnapshot(c.before),変更後:summarySnapshot(c.after)},null,2))}</pre></details></td></tr>`).join('')||'<tr><td colspan="3">変更はまだありません。</td></tr>'}</tbody></table></div><div class="sectionbar"><h2>引換・取消履歴</h2></div><div class="tablebox"><table><thead><tr><th>日時</th><th>抽選番号</th><th>操作</th><th>在庫復元 / 理由</th></tr></thead><tbody>${e.exchanges.slice().reverse().map(x=>`<tr><td>${fmt(x.time)}</td><td>#${e.draws.find(d=>d.id===x.drawId)?.number||'—'}</td><td>${esc(x.kind)}</td><td>${x.restore?'あり':'なし'} ${esc(x.reason)}</td></tr>`).join('')||'<tr><td colspan="4">引換履歴はまだありません。</td></tr>'}</tbody></table></div>`;}
function summarySnapshot(p){if(!p)return p;const v={...p};if('image'in v)v.image=v.image?'画像あり':'';delete v.pin;return v;}
function reportView(e){const valid=e.draws.filter(d=>!d.void),max=Math.max(1,...e.prizes.map(p=>valid.filter(d=>d.prizeId===p.id).length));return `<div class="sectionbar"><h2>イベントの集計</h2>${btn('集計CSV','csv-report','small')}</div><div class="report"><section class="card"><h3>景品別の有効当選数</h3>${e.prizes.map(p=>{const n=valid.filter(d=>d.prizeId===p.id).length;return `<div class="chartrow"><span>${esc(p.name)}</span><div class="bar"><i style="width:${n/max*100}%"></i></div><b>${num(n)}</b></div><small class="muted">現在残数 ${num(p.remaining)}本 ${p.hidden?'（無効化済み）':''}</small>`;}).join('')}</section><section class="card"><h3>運営レポート</h3><table><tbody>${[['総抽選回数',e.draws.length],['有効な抽選回数',valid.length],['引換済み',valid.filter(d=>d.exchange==='引換済み').length],['未引換',valid.filter(d=>d.exchange==='未引換').length],['引換辞退',valid.filter(d=>d.exchange==='辞退').length],['取り消し',e.draws.filter(d=>d.void).length],['イベント開始',fmt(e.started)],['最終抽選',fmt(e.draws.at(-1)?.time)]].map(([a,b])=>`<tr><td>${a}</td><td><b>${b}</b></td></tr>`).join('')}</tbody></table><div class="actions" style="margin-top:20px">${btn('追加・補充履歴を見る','tab','small','data-tab="changes"')}${btn('イベントを終了する','end','small danger')}</div></section></div>`;}
function settingsView(e){return `<section class="card"><div class="sectionbar"><h2>イベント設定</h2>${btn('設定を編集','settings-edit','primary small')}</div><table><tbody>${[['イベント名',e.name],['開催日',e.date],['主催者',e.organizer||'—'],['説明',e.description||'—'],['音声',e.sound?'ON':'OFF'],['スタッフPIN','設定済み（保護して保存）']].map(([a,b])=>`<tr><th>${a}</th><td>${esc(b)}</td></tr>`).join('')}</tbody></table><div class="actions" style="margin-top:22px">${btn(e.sound?'音をOFFにする':'音をONにする','sound')}${btn('PINを変更','pin-change')}${btn('一時停止','pause')}${btn('イベントを終了','end','danger')}</div><p class="help" style="margin-top:18px">PINは忘れないよう管理してください。PINを忘れたイベントの管理ロックは解除できません。</p></section>`;}
function dataView(){return `<section class="card"><h2>データのバックアップ</h2><p>このブラウザに保存されたイベント・景品画像・抽選履歴を、まとめて保存します。</p><div class="notice">端末やブラウザを変えるとデータは共有されません。ブラウザの保存データを消す前や、イベント終了後にJSONバックアップを保管してください。復元は全イベントを置き換えます。</div><div class="actions">${btn('JSONバックアップを書き出す','backup','primary')}${btn('JSONから復元する','restore')}</div><p class="help" style="margin-top:20px">バックアップには画像・PINの保護情報を含みます。外部に公開せず保管してください。開催中の参加者への端末受け渡しには「福引画面」を使用してください。</p></section>`;}
function play(){const e=eventNow(),d=e.draws.find(d=>d.id===e.pending);if(d&&!spinning)return resultView(e,d);const active=e.status==='開催中'&&e.allowed&&!e.pending&&Engine.total(e)>0;let note=active?'ボタンをタップして、運だめし！':e.status==='終了'?'たくさんのご参加ありがとうございました！':'スタッフの準備ができるまでお待ちください。';let title=e.status==='終了'&&!Engine.total(e)?'本日の福引は終了しました！':e.name;return `<main class="play"><div class="play-top"><span>ふくびきメーカー</span>${btn('スタッフ操作','staff','ghost small',spinning?'disabled':'')}</div>${e.image?`<img class="play-title-image" src="${esc(e.image)}" alt="イベント">`:''}<h1 class="play-title">${esc(title)}</h1><div class="play-art ${spinning?'spin':''}">${machine(d?.snapshot.color)}</div>${btn(spinning?'抽選中…':active?'ガラポンを回す！':'スタッフの準備待ち','draw','primary play-go',active&&!spinning?'':'disabled')}<p class="play-note">${spinning?'どの玉が出るかな…':note}</p></main>`;}
function resultView(e,d){const p=d.snapshot,lux=p.rank==='luxury';return `<main class="play"><div class="play-top"><span>${esc(e.name)}</span>${btn('スタッフ操作','staff','ghost small')}</div><section class="result ${p.rank}">${lux?Array.from({length:24},(_,i)=>`<i class="confetti" style="left:${i*4}%;animation-delay:${(i%7)*.37}s;background:${['#d5b667','#bd392f','#eadba9'][i%3]}"></i>`).join(''):''}<h2>${d.void?'抽選取り消し':lux?'大当たり！！':'おめでとうございます！'}</h2><div class="result-grade"><i class="ball" style="background:${p.color};width:28px;height:28px"></i>${esc(p.grade)}</div>${p.image?`<img class="result-img" src="${esc(p.image)}" alt="${esc(p.name)}">`:gift('result-img')}<h3>${esc(p.name)}</h3><p>${esc(p.description)}</p><div class="result-number">抽選番号 #${String(d.number).padStart(4,'0')}　${fmt(d.time)}</div><span class="badge">${d.void?'取消済み':esc(d.exchange)}</span></section><p class="play-note">${d.exchange==='未引換'&&!d.void?'この画面をスタッフにお見せください。':'ご参加ありがとうございました！'}</p>${btn('スタッフ：引換確認・次のお客様','staff','dark play-go')}</main>`;}
function staffView(){const e=eventNow(),d=e.draws.find(x=>x.id===e.pending);const remaining=Engine.total(e);modal('スタッフ操作',`<p class="help">${esc(e.name)} ／ ${esc(e.status)} ／ 抽選対象 ${num(remaining)}本</p>${d?`<div class="notice"><b>#${d.number} ${esc(d.snapshot.grade)}　${esc(d.snapshot.name)}</b><br>${d.void?'取消済み':esc(d.exchange)}</div>${!d.void&&d.exchange==='未引換'?`<div class="actions" style="justify-content:flex-start">${btn('景品引換完了','redeem','primary')}${btn('引換辞退','decline')}</div>`:''}`:''}<div class="actions" style="justify-content:flex-start">${btn('一時停止して管理画面へ','admin-pause')}${btn('音声 '+(e.sound?'ON':'OFF'),'sound','small')}</div>${!remaining?`<p class="notice">${e.prizes.some(p=>!p.hidden&&p.remaining>0)?'一時停止中の景品があります。有効に戻すと再開できます。':'景品がありません。追加・補充して再開できます。'}</p>`:''}`,async()=>{await mutate(e=>Engine.permit(e));authUntil=0;view='play';render();},d?'次のお客様へ':remaining?'抽選を許可する':'終了・待機画面へ');const submit=$('#modal [type=submit]');if(d&&!d.void&&d.exchange==='未引換')submit.disabled=true;}
async function eventForm(existing){const e=existing||{name:'わくわく福引大会',date:new Date().toLocaleDateString('sv-SE'),organizer:'',description:'',background:'#fbf7ed',image:'',sound:true};modal(existing?'イベント設定を編集':'新しい福引を作る',`<div class="formgrid">${input('イベント名','name',e.name,'text','required maxlength="120"')}${input('開催日','date',e.date,'date','required')}${input('主催者名','organizer',e.organizer,'text','maxlength="120"')}${input('背景色','background',e.background,'color')}${textArea('説明文','description',e.description)}${imageInput('タイトル画像（任意）','image',e.image)}${existing?'':input('スタッフPIN（4〜6桁）','pin','','password','required inputmode="numeric" pattern="[0-9]{4,6}" maxlength="6" autocomplete="new-password"')}<label class="check"><input name="sound" type="checkbox" ${e.sound?'checked':''}>音を鳴らす</label></div>${!existing?'<p class="help">5種類・100本のサンプル景品で作成します。あとから自由に変更できます。</p>':''}`,async f=>{const values={name:String(f.get('name')).trim(),date:f.get('date'),organizer:f.get('organizer').trim(),description:f.get('description').trim(),background:f.get('background'),sound:f.has('sound'),image:f.has('imageRemove')?'':await compress(f.get('image'))||e.image};if(!values.name)throw Error('イベント名を入力してください。');if(existing){await mutate(ev=>{const before={name:ev.name,date:ev.date,organizer:ev.organizer,description:ev.description,background:ev.background,image:ev.image,sound:ev.sound};Object.assign(ev,values);Engine.log(ev,'イベント設定',null,before,values);},true);}else{const pin=await newPIN(f.get('pin'));const fresh=Engine.event({...values,pin});await update(s=>{s.events.push(fresh);s.last=fresh.id;});current=fresh.id;authId=current;authUntil=Date.now()+60000;}view='admin';tab='prizes';render();toast('イベントを保存しました。');},existing?'変更を保存':'福引を作成する');}
function prizeForm(pid){const e=eventNow(),existing=e.prizes.find(p=>p.id===pid),p=existing||Engine.prize({remaining:1,color:'#df453a',rank:'normal'});modal(existing?'景品を編集':'新しい景品を追加',`<div class="formgrid">${input('等級名','grade',p.grade,'text','maxlength="30"')}${input('景品名','name',p.name,'text','required maxlength="120"')}${input('現在の残り本数','remaining',p.remaining,'number','required min="0" max="1000000" step="1"')}${input('玉の色','color',p.color,'color')}<label class="field">当選演出<select name="rank">${[['luxury','豪華'],['normal','通常'],['simple','簡易']].map(([a,b])=>`<option value="${a}" ${p.rank===a?'selected':''}>${b}</option>`).join('')}</select></label>${input('表示順','order',existing?p.order:e.prizes.length,'number','required min="0" max="9999" step="1"')}${textArea('景品の説明','description',p.description)}${imageInput('景品画像（任意）','image',p.image)}<label class="check"><input name="enabled" type="checkbox" ${p.enabled?'checked':''}>抽選対象にする</label>${input('変更理由・メモ（任意）','reason','','text','maxlength="2000"')}</div>${existing?`<p class="help">景品ID：${esc(p.id)}<br>初期 ${p.initial}本 ／ 累計当選 ${p.won}本。過去の当選結果は変更しません。</p>`:''}`,async f=>{const image=f.has('imageRemove')?'':await compress(f.get('image'))||p.image;const values={grade:f.get('grade').trim(),name:f.get('name').trim(),remaining:Engine.count(Number(f.get('remaining'))),color:f.get('color'),rank:f.get('rank'),order:Number(f.get('order')),description:f.get('description').trim(),image,enabled:f.has('enabled')};await mutate(ev=>Engine.editPrize(ev,pid,values,f.get('reason')),true);render();toast('保存しました。次回の抽選から反映されます。');});}
function quantityForm(pid,add){const p=eventNow().prizes.find(p=>p.id===pid);modal(add?'景品を補充':'残り本数を変更',`<p>${esc(p.name)} ／ 現在 ${num(p.remaining)}本</p>${input(add?'追加する本数':'変更後の残り本数','quantity',add?1:p.remaining,'number','required min="0" max="1000000" step="1"')}${input('理由・メモ','reason','','text','maxlength="2000"')}`,async f=>{const v=Engine.count(Number(f.get('quantity')));await mutate(e=>{const p=e.prizes.find(x=>x.id===pid),before=Engine.clone(p);p.remaining=Engine.count(add?p.remaining+v:v);Engine.log(e,add?'補充':'残数変更',pid,before,p,f.get('reason'));},true);render();toast('残数と当選確率を更新しました。');});}
function download(name,content,type){const a=document.createElement('a'),url=URL.createObjectURL(new Blob([content],{type}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);}
function csv(name,rows){const cell=v=>{let s=String(v??'');if(/^[=+\-@\t\r]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"';};download(name,'\uFEFF'+rows.map(row=>row.map(cell).join(',')).join('\r\n'),'text/csv;charset=utf-8');}
function exportCSV(kind){const e=eventNow();if(kind==='draw')csv('抽選履歴.csv',[['抽選ID','番号','イベントID','日時','景品ID','等級','景品名','画像データ','玉の色','引換状態','引換日時','無効','理由','在庫復元'],...e.draws.map(d=>[d.id,d.number,d.eventId,d.time,d.prizeId,d.snapshot.grade,d.snapshot.name,d.snapshot.image,d.snapshot.color,d.exchange,d.exchangeAt,d.void,d.voidReason,d.restored])]);else if(kind==='change')csv('景品変更履歴.csv',[['変更ID','イベントID','景品ID','日時','操作','変更前','変更後','理由'],...e.changes.map(c=>[c.id,c.eventId,c.prizeId,c.time,c.type,JSON.stringify(summarySnapshot(c.before)),JSON.stringify(summarySnapshot(c.after)),c.reason])]);else{const valid=e.draws.filter(d=>!d.void);csv('集計レポート.csv',[['イベント名',e.name],['開始',e.started],['最終抽選',e.draws.at(-1)?.time],['総抽選',e.draws.length],['有効抽選',valid.length],['引換済み',valid.filter(d=>d.exchange==='引換済み').length],['未引換',valid.filter(d=>d.exchange==='未引換').length],['辞退',valid.filter(d=>d.exchange==='辞退').length],['取り消し',e.draws.length-valid.length],[],['景品ID','現在の等級','現在の景品名','初期数','現在残数','累計当選','有効当選'],...e.prizes.map(p=>[p.id,p.grade,p.name,p.initial,p.remaining,p.won,valid.filter(d=>d.prizeId===p.id).length])]);}}
function backup(){download('ふくびきバックアップ_'+new Date().toLocaleDateString('sv-SE')+'.json',JSON.stringify({...state,exportedAt:Engine.now()},null,2),'application/json');toast('バックアップを書き出しました。');}
function restore(){modal('バックアップから復元',`<div class="notice">全イベントを置き換えます。現在のデータをJSONで書き出してから操作してください。</div><label class="field">JSONバックアップ<input name="file" type="file" accept=".json,application/json" required></label><label class="check"><input type="checkbox" name="confirmed" required>現在のデータを置き換えることを確認しました</label>`,async f=>{const file=f.get('file');if(!file?.size||file.size>100*1024*1024)throw Error('100MB以下のJSONファイルを選んでください。');let parsed;try{parsed=JSON.parse(await file.text());}catch{throw Error('JSONファイルを読み込めません。');}Engine.validate(parsed);await update(s=>{s.events=parsed.events;s.last=parsed.last;s.version=1;});authUntil=0;current=null;view='home';render();toast('バックアップを復元しました。');},'置き換えて復元');}
let audio;
function tone(f=700,d=.07,delay=0,type='sine',gain=.08){if(!eventNow()?.sound)return;try{audio ||= new(window.AudioContext||window.webkitAudioContext)();audio.resume();const o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime+delay;o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(gain,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+d+.02);}catch{}}
function animateSound(rank){for(let i=0;i<35;i++)tone(180+(i%7)*45,.03,i*.075,'triangle',.04);tone(900,.12,3);tone(530,.12,3.35);const notes=rank==='luxury'?[523,659,784,1047,784,1047]:rank==='normal'?[659,784,1047]:[784,1047];notes.forEach((n,i)=>tone(n,.28,4+i*.13,'sine',.1));}
async function doDraw(){if(busy||spinning)return;busy=true;try{const d=await update(s=>{const e=s.events.find(x=>x.id===current);return Engine.draw(e);});spinning=true;render();animateSound(d.snapshot.rank);setTimeout(()=>{spinning=false;render();},5000);}catch(err){fail(err);}finally{busy=false;}}
function help(){modal('使い方',`<p>① 新しい福引を作り、スタッフPINを設定します。<br>② 景品の名前・画像・残り本数を調整します。<br>③ 福引画面でスタッフが抽選を許可します。<br>④ お客様がガラポンを回します。<br>⑤ スタッフがPINを入力し、引換完了→次のお客様へ進みます。</p><p class="help">途中補充は「スタッフ操作」→「一時停止して管理画面へ」から。データはこの端末のブラウザに保存されます。定期的にJSONバックアップを保管してください。PINは端末を渡す際の誤操作防止用です。</p>`,async()=>{},'閉じる');}
async function action(a,el){if(spinning||busy)return;const id=el?.dataset.id;
  if(a==='draw'){await doDraw();return;}
  if(a==='help'){help();return;}
  if(a==='home'){view='home';authUntil=0;render();return;}
  if(a==='new'){eventForm();return;}
  if(a==='global'){if(!state.events.length){modal('管理者設定',`<p>PINはイベントごとに設定します。バックアップファイルがある場合は復元できます。</p>${btn('JSONから復元','restore')}`,async()=>{},'閉じる');}else{current=state.last&&state.events.some(e=>e.id===state.last)?state.last:state.events[0].id;authenticate(()=>{view='admin';tab='data';render();});}return;}
  if(a==='open'||a==='manage'||a==='resume'){current=a==='resume'?(state.last||state.events.at(-1)?.id):id;if(!eventNow())return;await update(s=>s.last=current);if(a==='manage')authenticate(async()=>{await mutate(e=>{e.allowed=false;if(e.status==='開催中')e.status='一時停止';});view='admin';tab='prizes';render();});else{authUntil=0;view='play';render();}return;}
  if(a==='staff'){authenticate(staffView);return;}
  if(a==='play'){view='play';authUntil=0;render();return;}
  if(a==='tab'){tab=el.dataset.tab;render();return;}
  if(a==='restore'&&!state.events.length){$('#modal').close();restore();return;}
  if(!authorized()){const clone=el?.cloneNode(true);authenticate(()=>action(a,clone));return;}
  tone(640,.035);
  if(a==='add'||a==='edit'){prizeForm(id);return;}
  if(a==='supply'||a==='quantity'){quantityForm(id,a==='supply');return;}
  if(a==='settings-edit'){eventForm(eventNow());return;}
  if(a==='toggle'){await mutate(e=>{const p=e.prizes.find(x=>x.id===id),before=Engine.clone(p);p.enabled=!p.enabled;Engine.log(e,p.enabled?'再開':'一時停止',id,before,p);});render();return;}
  if(a==='remove'){const p=eventNow().prizes.find(x=>x.id===id);modal('景品を削除',`<p>「${esc(p.name)}」を削除しますか？</p><p class="help">抽選履歴がある景品は、履歴を残して無効化・非表示にします。</p>`,async()=>{await mutate(e=>Engine.removePrize(e,id));render();},'削除する');return;}
  if(a==='duplicate'){modal('イベントを複製',`<p>景品の初期本数から新しく始めます。抽選・引換・変更履歴はコピーしません。スタッフPINは元の設定を引き継ぎます。</p>`,async()=>{let fresh;await mutate((e,s)=>{fresh=Engine.duplicate(e);s.events.push(fresh);s.last=fresh.id;});current=fresh.id;authId=current;view='admin';tab='prizes';render();},'複製する');return;}
  if(a==='admin-pause'||a==='pause'){await mutate(e=>{const before=e.status;e.status='一時停止';e.allowed=false;Engine.log(e,'イベント一時停止',null,{status:before},{status:e.status});});$('#modal').close();view='admin';render();return;}
  if(a==='end'){modal('イベントを終了する',`<p>抽選を停止し、終了画面に切り替えます。履歴や残り本数は残ります。</p><p class="help">未引換の結果がある場合は、その結果を引き続き表示します。終了後も追加・補充して再開できます。</p>`,async()=>{await mutate(e=>{const before=e.status;e.status='終了';e.allowed=false;Engine.log(e,'イベント終了',null,{status:before},{status:e.status});});render();},'終了する');return;}
  if(a==='sound'){await mutate(e=>e.sound=!e.sound);render();if($('#modal').open)staffView();return;}
  if(a==='pin-change'){modal('スタッフPINの変更',input('新しいPIN','pin','','password','required inputmode="numeric" pattern="[0-9]{4,6}" maxlength="6"'),async f=>{const pin=await newPIN(f.get('pin'));await mutate(e=>e.pin=pin);toast('PINを変更しました。');});return;}
  if(a==='redeem'){await mutate(e=>Engine.settle(e,e.pending,'引換済み'));render();staffView();return;}
  if(a==='decline'){modal('引換辞退',`<p>辞退を記録します。在庫を戻す場合、次回以降の抽選対象になります。</p><label class="check"><input name="restore" type="checkbox">景品の在庫を1本戻す</label>${input('理由・メモ','reason','','text','maxlength="2000"')}`,async f=>{await mutate(e=>Engine.settle(e,e.pending,'辞退',f.has('restore'),f.get('reason')));render();setTimeout(staffView,0);},'辞退を記録');return;}
  if(a==='void'){modal('抽選の取り消し',`<p>当選履歴を残して無効化します。引換済み景品を戻す場合は、回収できたことを確認してください。</p>${input('取消理由（必須）','reason','','text','required maxlength="2000"')}<label class="check"><input type="checkbox" name="restore">景品を在庫に戻す（未復元の場合のみ）</label>`,async f=>{await mutate(e=>Engine.settle(e,id,'取消',f.has('restore'),f.get('reason')));render();},'取り消す');return;}
  if(a==='backup'){backup();return;}
  if(a==='restore'){restore();return;}
  if(a.startsWith('csv-')){exportCSV(a.slice(4));return;}
}
document.addEventListener('click',ev=>{const el=ev.target.closest('[data-action]');if(el){ev.preventDefault();Promise.resolve(action(el.dataset.action,el)).catch(fail);}});
document.addEventListener('input',ev=>{if(['search-history','filter-history'].includes(ev.target.id))$('#history-body').innerHTML=historyRows(eventNow());});
window.addEventListener('beforeunload',ev=>{if(spinning){ev.preventDefault();ev.returnValue='';}});
async function boot(){try{await openDB();if(!navigator.locks)throw Error('このブラウザは複数タブ保護に対応していません。最新のChrome、Edge、Safari、Firefoxをお使いください。');navigator.locks.request('fukubiki-maker-exclusive',{ifAvailable:true},async lock=>{if(!lock){$('#app').innerHTML=frame('<div class="card"><h2>別のタブで開いています</h2><p>在庫の二重操作を防ぐため、このタブでは操作できません。先に開いたタブを閉じてから再読み込みしてください。</p><button onclick="location.reload()">再読み込み</button></div>');return;}hasLock=true;state=await readDB();current=state.last;if(eventNow()?.pending)view='play';render();await new Promise(()=>{});}).catch(fail);}catch(err){$('#app').innerHTML=frame(`<div class="card"><h2>保存機能を利用できません</h2><p>${esc(err.message)}</p><p class="help">ブラウザのデータ保存を許可して、HTTPSの公開URLから開いてください。</p></div>`);}}
boot();
</script></body></html>
