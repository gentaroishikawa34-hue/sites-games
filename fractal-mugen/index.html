*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff;color:#283b49;font-family:system-ui,sans-serif}canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}button,input{font:inherit}button{cursor:pointer;color:inherit;background:none;border:0}#edge{position:fixed;right:0;bottom:calc(16px + env(safe-area-inset-bottom));width:44px;height:52px;opacity:.28;font-size:24px;z-index:3}#edge:hover,#edge:focus-visible{opacity:1}#intro{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;transition:opacity 1.2s;background:#ffffff44}#intro.hide{opacity:0}.card{text-align:center;background:#fffffff0;padding:38px 28px;border:1px solid #d8dfdf;border-radius:2px;box-shadow:0 12px 60px #32465a0a;max-width:90vw}.eyebrow{font-size:10px;letter-spacing:.38em;color:#798b90}h1{font-family:Georgia,serif;font-size:clamp(30px,7vw,47px);font-weight:400;letter-spacing:.14em;margin:19px 0 8px}.jp{letter-spacing:.5em;font-size:13px}.rule{width:38px;height:1px;background:#b99c69;margin:25px auto}.guide{font-size:12px;line-height:2.1;color:#64757d}.hint{font-size:10px;letter-spacing:.15em;margin-top:26px;color:#9b8271}dialog{border:1px solid #dbe1df;background:#fffffff5;color:#344a55;width:min(370px,90vw);padding:25px;box-shadow:0 20px 100px #263e4922}dialog::backdrop{background:#ffffff55;backdrop-filter:blur(7px)}dialog h2{font-size:15px;letter-spacing:.15em;font-weight:400;margin:0 0 20px}dialog button.action{display:block;width:100%;padding:14px 4px;text-align:left;border-bottom:1px solid #e5e9e7;font-size:13px}dialog label{display:block;font-size:12px;margin-top:22px}input[type=range]{width:100%;accent-color:#426778;margin-top:13px}.notes{font-size:11px;line-height:1.9;color:#77868a}.close{float:right;font-size:20px}#toast{position:fixed;left:50%;bottom:9%;transform:translateX(-50%);padding:8px 16px;color:#48636d;background:#ffffffdd;border-radius:20px;opacity:0;transition:opacity .5s;font- </style></head><body><canvas id="art" aria-label="操作できるフラクタル紋様"></canvas><div id="intro"><div class="card"><div class="eyebrow">AN EVER-CHANGING GEOMETRY</div><h1>FRACTAL</h1><div class="jp">無限紋様</div><div class="rule"></div><div class="guide">時とともに育ち、触れると生まれ変わる。<br>二度・三度のタップで、大きな変化。<br>長押しで深く。円を描いて、渦を。<br>二本指で、細部へ。</div><div class="hint">画面に触れて、はじめる</div></div></div><button id="edge" aria-label="設定と保存" title="設定と保存">⋮</button><dialog id="menu"><button class="close" id="close" aria-label="閉じる">×</button><h2>FRACTAL / 無限紋様</h2><button class="action" id="save">この瞬間を PNG で保存</button><button class="action" id="share">画像を共有</button><button class="action" id="json">生成パラメータを保存（JSON）</button><label>成長・変化の速さ<input id="speed" type="range" min="0.1" max="2" step="0.1" value="0.6"></label><label>線の濃さ<input id="ink" type="range" min="0.3" max="1" step="0.05" value="0.75"></label><p class="notes">藍・朱・若竹・藤・金茶・紅<br>1回：変異 ／ 2回：対称性 ／ 3回：大胆な変異<br>長押し：密度 ／ なぞる：回転 ／ 円：渦<br>ピンチ・マウスホイール：拡大縮小<br>中心・中間・外側で変化の傾向が異なります。<br>PNGとJSONは同じ保存時点を記録します。<br>JSONは再計算用の資料です。読み込み・巻き戻し機能はありません。</p><p class="notes" id="renderer"></p></dialog><div id="toast" role="status"></div>
<script>
'use strict';
const $=id=>document.getElementById(id),TAU=Math.PI*2,clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),mix=(a,b,t)=>a+(b-a)*t;
const palette=[[22,83,103],[190,66,53],[61,139,111],[137,109,162],[165,122,51],[171,54,86]];
let seed=crypto.getRandomValues(new Uint32Array(1))[0];const initialSeed=seed;
function rand(){seed^=seed<<13;seed^=seed>>>17;seed^=seed<<5;return(seed>>>0)/4294967296}
let target={sides:3+Math.floor(rand()*5),arms:6,depth:.15,growth:0,scale:.37,twist:.28,spread:.66,color:rand()*6,star:.15,spin:.035,swirl:0,zoom:1};let state={...target};
let canvas=$('art'),gl,ctx,program,buffer,loc={},w=innerWidth,h=innerHeight,quality=1,clock=0,angle=0,last=0,frameAvg=16,qualityClock=0,ink=.75,speed=matchMedia('(prefers-reduced-motion: reduce)').matches?.15:.6;
$('speed').value=speed;const MAX_FLOATS=2400000,data=new Float32Array(MAX_FLOATS);let used=0,nodeCount=0,snapshot=null;
function shader(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s}
function initRenderer(){try{gl=canvas.getContext('webgl',{alpha:false,antialias:true,preserveDrawingBuffer:true});if(!gl)throw Error('no WebGL');program=gl.createProgram();let vs=shader(gl.VERTEX_SHADER,'attribute vec2 p;attribute vec4 c;uniform vec2 size;varying vec4 col;void main(){gl_Position=vec4(p.x/size.x*2.0-1.0,1.0-p.y/size.y*2.0,0,1);col=c;}'),fs=shader(gl.FRAGMENT_SHADER,'precision mediump float;varying vec4 col;void main(){gl_FragColor=col;}');gl.attachShader(program,vs);gl.attachShader(program,fs);gl.linkProgram(program);if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw Error('link');gl.deleteShader(vs);gl.deleteShader(fs);buffer=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buffer);gl.bufferData(gl.ARRAY_BUFFER,data.byteLength,gl.DYNAMIC_DRAW);gl.useProgram(program);for(const [key,n,offset] of [['p',2,0],['c',4,8]]){const l=gl.getAttribLocation(program,key);gl.enableVertexAttribArray(l);gl.vertexAttribPointer(l,n,gl.FLOAT,false,24,offset)}loc.size=gl.getUniformLocation(program,'size');gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);$('renderer').textContent='WebGL · 自己相似アフィン変換';}catch(e){gl=null;const replacement=canvas.cloneNode();canvas.replaceWith(replacement);canvas=replacement;ctx=canvas.getContext('2d');$('renderer').textContent='Canvas 2D · 軽量表示';}}
initRenderer();
function resize(){w=innerWidth;h=innerHeight;const d=Math.min(devicePixelRatio||1,2)*quality;canvas.width=Math.max(1,Math.round(w*d));canvas.height=Math.max(1,Math.round(h*d))}resize();addEventListener('resize',resize);
function colorAt(v){v=((v%6)+6)%6;const a=palette[Math.floor(v)],b=palette[(Math.floor(v)+1)%6],f=v%1;return a.map((x,i)=>mix(x,b[i],f)/255)}
function vertex(x,y,c,a){data[used++]=x;data[used++]=y;data[used++]=c[0];data[used++]=c[1];data[used++]=c[2];data[used++]=a}
function line(x,y,X,Y,c,a){if(used+12>=MAX_FLOATS)return;if(gl){vertex(x,y,c,a);vertex(X,Y,c,a)}else{ctx.strokeStyle=`rgba(${c.map(v=>Math.round(v*255)).join(',')},${a})`;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(X,Y);ctx.stroke()}}
// Continuous polygons are sampled along their straight edges. Each descendant
// uses the same contractive affine map: T_i(z) = s*R(theta)*z + offset_i.
function boundary(t,n){const k=Math.floor(n),f=n-k;function pt(N){const u=t*N,j=Math.floor(u),v=u-j,a=j*TAU/N,b=(j+1)*TAU/N;return[mix(Math.cos(a),Math.cos(b),v),mix(Math.sin(a),Math.sin(b),v)]}const a=pt(k),b=pt(k+1);return[mix(a[0],b[0],f),mix(a[1],b[1],f)]}
function geometry(S,time,rotation,W,H){used=0;nodeCount=0;const arms=Math.ceil(S.arms),budget=gl?5000:1800;let levels=0,total=1,power=1;while(levels<6&&total+power*arms<=budget){power*=arms;total+=power;levels++}const depth=Math.min(S.depth+Math.max(0,Math.log2(S.zoom))*.22,levels+.85);const contraction=clamp(S.scale+Math.sin(time*.17)*.018,.23,.47),twist=S.twist+Math.sin(time*.11)*.09;
const points=Array.from({length:25},(_,i)=>{const p=boundary(i/24,S.sides),f=1-S.star*.36*(1-Math.cos(i/24*TAU*Math.round(S.sides)))/2;return[p[0]*f,p[1]*f]});
const colors=Array.from({length:8},(_,i)=>colorAt(S.color+time*.022+i*.79));
function node(x,y,r,a,level,opacity){nodeCount++;if(opacity<.015||r<.25||nodeCount>budget)return;const c=colors[level],co=Math.cos(a),si=Math.sin(a),alpha=opacity*ink*(level===0?.60:.78);for(let i=0;i<24;i++){const p=points[i],q=points[i+1];line(x+r*(p[0]*co-p[1]*si),y+r*(p[0]*si+p[1]*co),x+r*(q[0]*co-q[1]*si),y+r*(q[0]*si+q[1]*co),c,alpha)}if(level>=levels||level>=depth)return;const fade=clamp(depth-level,0,1);for(let j=0;j<arms;j++){const weight=clamp(S.arms-j,0,1),b=a+TAU*j/S.arms,dist=r*S.spread;node(x+Math.cos(b)*dist,y+Math.sin(b)*dist,r*contraction,a+twist+S.swirl*.13*level+TAU*j/S.arms,level+1,opacity*weight*fade)}}
node(W/2,H/2,Math.min(W,H)*(.24+.10*S.growth)*S.zoom*(1+.025*Math.sin(time*.23)),rotation,0,1)}
function render(){if(gl){gl.viewport(0,0,canvas.width,canvas.height);gl.clearColor(1,1,1,1);gl.clear(gl.COLOR_BUFFER_BIT);gl.uniform2f(loc.size,w,h)}else{ctx.setTransform(canvas.width/w,0,0,canvas.height/h,0,0);ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);ctx.lineWidth=.7}geometry(state,clock,angle,w,h);if(gl){gl.bufferSubData(gl.ARRAY_BUFFER,0,data.subarray(0,used));gl.drawArrays(gl.LINES,0,used/6)}}
function notify(s){$('toast').textContent=s;$('toast').style.opacity=1;clearTimeout(notify.timer);notify.timer=setTimeout(()=>$('toast').style.opacity=0,1400)}
function dismiss(){ $('intro').classList.add('hide');try{localStorage.setItem('fractal-intro','1')}catch{}}
try{if(localStorage.getItem('fractal-intro'))$('intro').classList.add('hide')}catch{}
function ripple(x,y){const el=document.createElement('div');el.className='ripple';el.style.left=x-12+'px';el.style.top=y-12+'px';document.body.append(el);setTimeout(()=>el.remove(),800)}
function mutate(n,x,y){const radius=clamp(Math.hypot(x-w/2,y-h/2)/(Math.min(w,h)*.5),0,1),center=(1-radius)**2,outer=radius**2,mid=4*radius*(1-radius),d=()=>rand()-.5;
 target.twist+=d()*(.25+mid*.65)*n;target.scale=clamp(target.scale+d()*(.025+center*.13)*n,.25,.45);target.spread=clamp(target.spread+d()*.14*mid*n,.45,.85);target.color+=.08+outer*.4+d()*.12;target.depth=clamp(target.depth+mid*.08,.15,5.8);
 if(center>.2||n===3)target.sides=clamp(Math.round(target.sides+(rand()>.5?1:-1)*(n===3?2:1)),3,8);
 if(n>=2){const choices=[3,4,5,6,8,10,12];target.arms=choices[(choices.indexOf(Math.round(target.arms))+1+(n===3?2:0))%choices.length];target.color+=.7;}
 if(n===3){target.star=1-target.star;target.scale=clamp(target.scale+d()*.18,.25,.45);target.twist+=d()*1.4;target.swirl+=d()*.6}
 notify(n===1?'紋様が、ほどける':n===2?'対称が、うつろう':'新しい秩序へ');snapshot=null;
}
const pointers=new Map();let gesture=null,pinch=null,taps=0,tapTimer=null,tapPoint=null,tapLast=0;
function flushTaps(){clearTimeout(tapTimer);if(taps&&tapPoint)mutate(taps,tapPoint.x,tapPoint.y);taps=0}
function cancelTaps(){clearTimeout(tapTimer);taps=0}
function point(e){return{x:e.clientX,y:e.clientY,t:performance.now()}}
function distance(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function down(e){if(e.button!==0&&e.pointerType==='mouse')return;e.preventDefault();dismiss();ripple(e.clientX,e.clientY);canvas.setPointerCapture(e.pointerId);const p=point(e);pointers.set(e.pointerId,p);
 if(pointers.size>1){cancelTaps();gesture=null;const a=[...pointers.values()];pinch={distance:distance(a[0],a[1]),zoom:target.zoom};return}gesture={start:p,path:[p],moved:false,held:false,pinched:false};}
function move(e){if(!pointers.has(e.pointerId))return;const p=point(e);pointers.set(e.pointerId,p);if(pinch){if(pointers.size>=2){const a=[...pointers.values()];target.zoom=clamp(pinch.zoom*distance(a[0],a[1])/Math.max(1,pinch.distance),.35,8)}return}if(!gesture)return;const g=gesture;if(distance(p,g.start)>10){g.moved=true;cancelTaps()}if(g.path.length<256)g.path.push(p);else{g.path=g.path.filter((_,i)=>i%2===0);g.path.push(p)}}
function classify(path){if(path.length<10)return null;const cx=path.reduce((a,p)=>a+p.x,0)/path.length,cy=path.reduce((a,p)=>a+p.y,0)/path.length;let turn=0,length=0;const radii=path.map(p=>Math.hypot(p.x-cx,p.y-cy)),r=radii.reduce((a,b)=>a+b,0)/radii.length;for(let i=1;i<path.length;i++){let d=Math.atan2(path[i].y-cy,path[i].x-cx)-Math.atan2(path[i-1].y-cy,path[i-1].x-cx);d=Math.atan2(Math.sin(d),Math.cos(d));turn+=d;length+=distance(path[i],path[i-1])}const variance=Math.sqrt(radii.reduce((a,b)=>a+(b-r)**2,0)/radii.length);return Math.abs(turn)>4.7&&r>14&&distance(path[0],path.at(-1))<r*.9&&variance/r<.5?{turn,r,length}:null}
function up(e){if(!pointers.has(e.pointerId))return;const p=point(e);pointers.delete(e.pointerId);if(pinch){if(!pointers.size)pinch=null;gesture=null;return}const g=gesture;gesture=null;if(!g)return;if(g.held){notify('この深さを、残す');return}if(g.moved){const path=g.path;path.push(p);const circle=classify(path),duration=Math.max(80,p.t-g.start.t),v=distance(p,g.start)/duration;if(circle){target.swirl=clamp(target.swirl+Math.sign(circle.turn)*clamp(circle.r/150,.2,2)*clamp(circle.length/duration,.3,2),-5,5);target.twist+=Math.sign(circle.turn)*.3;notify(circle.turn>0?'右へ、渦を描く':'左へ、渦を描く')}else{const dx=p.x-g.start.x,dy=p.y-g.start.y;target.spin=clamp(dx/Math.max(w,1)*(.2+v),-.55,.55);target.twist+=dy/h*(.3+v);notify('流れが、変わる')}snapshot=null;return}
 if(p.t-g.start.t>=430)return;if(taps&&(p.t-tapLast>300||distance(p,tapPoint)>36))flushTaps();tapPoint=p;tapLast=p.t;taps++;clearTimeout(tapTimer);if(taps===3)flushTaps();else tapTimer=setTimeout(flushTaps,300);}
canvas.addEventListener('pointerdown',down);canvas.addEventListener('pointermove',move);canvas.addEventListener('pointerup',up);canvas.addEventListener('pointercancel',e=>{pointers.delete(e.pointerId);gesture=null;pinch=null;cancelTaps()});canvas.addEventListener('contextmenu',e=>e.preventDefault());canvas.addEventListener('wheel',e=>{e.preventDefault();dismiss();target.zoom=clamp(target.zoom*Math.exp(-e.deltaY*.001),.35,8);snapshot=null},{passive:false});
function tick(now){const raw=last?now-last:16;last=now;const dt=Math.min(raw/1000,.05);if(!document.hidden){if(gesture&&!gesture.moved&&!pinch&&now-gesture.start.t>=430){if(!gesture.held){cancelTaps();gesture.held=true;notify('細部へ、深く')}target.depth=clamp(target.depth+dt*.45,.15,5.8);target.scale=clamp(target.scale+dt*.006,.25,.45);snapshot=null}
 clock+=dt*speed;target.depth=Math.min(5.8,target.depth+dt*speed*.06);target.growth=Math.min(1,target.growth+dt*speed*.006);angle+=state.spin*dt*speed;for(const k in state)state[k]=mix(state[k],target[k],1-Math.exp(-dt*(k==='zoom'?7:1.1)));render();frameAvg=mix(frameAvg,raw,.02);qualityClock+=dt;if(qualityClock>4){qualityClock=0;if(frameAvg>30&&quality>.55){quality=Math.max(.55,quality-.15);resize()}else if(frameAvg<19&&quality<1){quality=Math.min(1,quality+.05);resize()}}}requestAnimationFrame(tick)}requestAnimationFrame(tick);
document.addEventListener('visibilitychange',()=>{last=0;pointers.clear();gesture=null;pinch=null;cancelTaps()});
canvas.addEventListener('webglcontextlost',e=>{e.preventDefault();notify('描画を復帰しています')});canvas.addEventListener('webglcontextrestored',()=>{initRenderer();resize()});
function capture(){return{format:'fractal-mugen',version:1,algorithm:'polygon-affine-ifs-v1',initialSeed,randomState:seed,state:{...state},target:{...target},time:clock,angle,width:w,height:h,ink,speed,palette,quality,createdAt:new Date().toISOString()}}
function download(blob,name){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),60000)}
function png(){const s=snapshot||capture();snapshot=s;const output=document.createElement('canvas'),scale=Math.min(3,4096/Math.max(s.width,s.height));output.width=Math.round(s.width*scale);output.height=Math.round(s.height*scale);const c=output.getContext('2d');c.scale(scale,scale);c.fillStyle='#fff';c.fillRect(0,0,s.width,s.height);
// Re-evaluate frozen geometry; render the same vertices at export resolution.
const oldInk=ink;ink=s.ink;if(gl){geometry(s.state,s.time,s.angle,s.width,s.height);c.lineWidth=.65;for(let i=0;i<used;i+=12){c.strokeStyle=`rgba(${Math.round(data[i+2]*255)},${Math.round(data[i+3]*255)},${Math.round(data[i+4]*255)},${data[i+5]})`;c.beginPath();c.moveTo(data[i],data[i+1]);c.lineTo(data[i+6],data[i+7]);c.stroke()}}else{const oldCtx=ctx;ctx=c;c.lineWidth=.7;geometry(s.state,s.time,s.angle,s.width,s.height);ctx=oldCtx}ink=oldInk;return new Promise((resolve,reject)=>output.toBlob(b=>b?resolve(b):reject(Error('PNG生成失敗')),'image/png'))}
$('edge').onclick=()=>{dismiss();snapshot=capture();$('menu').showModal()};$('close').onclick=()=>$('menu').close();$('menu').addEventListener('click',e=>{if(e.target===$('menu')){const r=$('menu').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)$('menu').close()}});
$('speed').oninput=e=>{speed=+e.target.value};$('ink').oninput=e=>{ink=+e.target.value;snapshot=null};
$('save').onclick=async()=>{try{download(await png(),'fractal-mugen.png');notify('この瞬間を保存しました')}catch{notify('画像を保存できませんでした')}};
$('share').onclick=async()=>{try{const blob=await png(),file=new File([blob],'fractal-mugen.png',{type:'image/png'});if(navigator.canShare?.({files:[file]}))await navigator.share({files:[file],title:'FRACTAL — 無限紋様'});else{download(blob,'fractal-mugen.png');notify('PNG画像を保存しました')}}catch(e){if(e.name!=='AbortError')notify('共有できません。PNG保存をお試しください')}};
$('json').onclick=()=>{snapshot=snapshot||capture();download(new Blob([JSON.stringify(snapshot,null,2)],{type:'application/json'}),'fractal-mugen.json');notify('生成パラメータを保存しました')};
</script></body></html>
