<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#030a23"><title>ことばの達人！</title><meta name="description" content="文字を選んで言葉を作れ！名詞をつくってコンボをつなぐ、60秒のことばパズル。"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%23062250'/%3E%3Ctext x='20' y='29' text-anchor='middle' fill='%23ffda58' font-size='29'%3Eあ%3C/text%3E%3C/svg%3E"><link rel="stylesheet" href="style.css"></head><body>
<main id="app"><header><span class="brand">ことばの達人<span>！</span></span><button id="sound" class="small" aria-label="サウンド設定">♪ 音声</button></header>
<section id="home" class="screen"><div class="eyebrow">60 SECOND WORD ARCADE</div><h1>ことばの<br><strong>達人<span>！</span></strong></h1><p class="catch">文字を選んで言葉を作れ！</p><div class="demo" aria-hidden="true"><i>こ</i><i>と</i><i>ば</i></div><div class="best"><span>BEST SCORE</span><b id="best">0</b></div><button id="start" class="gold big" disabled>辞書を読み込み中…</button><button id="how" class="link">遊び方・得点ルール</button><div class="homefoot"><span id="dictCount"></span><button id="credits" class="link">辞書・出典</button></div></section>
<section id="game" class="screen" hidden><div class="hud"><div><label>SCORE</label><b id="score">0</b></div><div class="clock" id="clock"><span>のこり</span><b id="seconds">60</b><span>秒</span></div></div><div class="timebar"><i id="timebar"></i></div><div class="wordbox"><div class="wordlabel">SELECTED WORD <button id="clear" class="link">全消去</button></div><div id="selected">文字を選ぼう</div></div><div id="feedback" aria-live="polite"><span>離れた文字も自由に選べる！</span></div><div id="board" aria-label="8列6行のひらがな盤面"></div><div class="chain"><div><b id="chain">0</b> CHAIN <span id="fever"></span></div><strong id="multiplier">×1.0</strong></div><div class="chainbar"><i id="chainbar"></i></div><div class="controls"><button id="undo">⌫<span>けす</span></button><button id="submit" class="gold">✓<span>決定</span></button><button id="hint" class="purple">✦<span>ヒント <small id="hints">3</small></span></button></div><p class="gamefoot">名詞なら1文字からOK · 同じ言葉も何度でも！</p></section>
<section id="result" class="screen" hidden><div class="eyebrow">TIME UP / RESULT</div><h2>おみごと！</h2><p id="record"></p><div class="resultscore" id="resultScore">0</div><div class="titlebadge" id="titlebadge"></div><dl id="stats"></dl><button id="replay" class="gold big">もう一度遊ぶ</button><button id="shareResult" class="share-result">結果をSNSでシェア</button><div class="resultlinks"><button class="link" id="words">成立した言葉を見る</button><button class="link" id="homeButton">タイトルへ</button></div></section>
<div id="countdown" hidden></div><div id="particles" aria-hidden="true"></div></main>
<dialog id="modal"><div class="modalhead"><h2 id="modalTitle"></h2><button id="close" aria-label="閉じる">×</button></div><div id="modalBody"></div></dialog>
<script type="module" src="app.js"></script></body></html>
