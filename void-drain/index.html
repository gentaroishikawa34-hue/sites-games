<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#000000"><title>VOID — 時空の排水口</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#eee;font-family:Arial,'Noto Sans',sans-serif}canvas{display:block;width:100%;height:100%;touch-action:none}button,select{font:inherit;color:inherit}button{cursor:pointer}#menu{position:fixed;right:max(20px,env(safe-area-inset-right));top:max(20px,env(safe-area-inset-top));width:44px;height:44px;border:1px solid #ffffff40;border-radius:50%;background:#0005;backdrop-filter:blur(10px);z-index:4;font-size:22px}#intro,#end{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;text-align:center;transition:opacity 1.8s;text-shadow:0 2px 20px #000}#intro h1{font-size:clamp(48px,13vw,106px);font-weight:300;letter-spacing:.24em;margin:0 0 12px;padding-left:.24em}#intro small{letter-spacing:.3em;font-size:10px;color:#ffffffb0}#intro p{margin-top:45px;font-size:10px;letter-spacing:.23em}#intro span{font-size:11px;color:#ffffff9a;letter-spacing:.12em}#end{opacity:0;letter-spacing:.25em;font-size:13px}#panel{position:fixed;right:20px;top:78px;width:min(340px,calc(100vw - 40px));max-height:calc(100dvh - 110px);overflow:auto;background:#111e;border:1px solid #ffffff25;border-radius:18px;padding:24px;z-index:5;backdrop-filter:blur(25px)}[hidden]{display:none!important}#panel header{font-size:23px;letter-spacing:.2em;margin-bottom:6px}#panel .sub{color:#999;font-size:11px;margin:0 0 25px}label{display:block;font-size:12px;color:#aaa;margin:17px 0 9px}select,#panel button{width:100%;padding:13px;border:1px solid #ffffff24;background:#222;border-radius:8px;text-align:left;margin-bottom:8px;font-size:13px}select{background:#222}#panel p{font-size:11px;line-height:1.9;color:#999}#panel input[type=range]{width:100%;accent-color:#aaa}#panel input[type=checkbox]{accent-color:#aaa}#remaining{position:fixed;left:20px;bottom:24px;font:10px monospace;letter-spacing:.15em;color:#aaa;pointer-events:none}#notice{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);width:max-content;max-width:85%;background:#181818e8;padding:14px 20px;border-radius:10px;font-size:12px;z-index:8;text-align:center}#error{position:fixed;inset:20%;font-size:15px;line-height:2;display:none}
</style><canvas id="view" aria-label="画像をタップして時空の穴を作成"></canvas><div id="intro"><h1>VOID</h1><small>時空の排水口</small><p>TOUCH TO CREATE A VOID</p><span>触れた場所から、世界がほどける。</span></div><div id="end">NOTHING REMAINS.</div><button id="menu" aria-label="メニューを開く" aria-expanded="false">☰</button><aside id="panel" hidden><header>VOID</header><p class="sub">画像に穴を開け、世界を吸い尽くす。</p><label for="scene">風景を選ぶ</label><select id="scene"><option>01 — 山岳 / ALPINE</option><option>02 — 海と空 / TIDAL</option><option>03 — 都市 / DUSK</option><option>04 — 森林 / SILENCE</option><option>05 — 抽象 / STRATA</option></select><button id="upload">＋ 自分の画像を読み込む</button><input id="file" type="file" accept="image/jpeg,image/png,image/webp" hidden><button id="restart">↺ 同じ画像でリスタート</button><button id="fullscreen">⛶ 全画面表示</button><button id="sound">音響：オフ</button><label for="speed">成長速度 <span id="speedval">1.0×</span></label><input id="speed" type="range" min="0.5" max="2" step="0.1" value="1"><label><input id="stats" type="checkbox"> 画像の残存率を表示</label><p>タップ：穴を作る<br>長押し：吸引を強める<br>ドラッグ：穴を移動する<br>2本指：2つの穴を同時操作</p><p>画像はこの端末の中だけで処理します。<br>読み込んだ画像は外部へ送信しません。</p></aside><div id="remaining" hidden>REMAINING 100.0%</div><div id="notice" hidden></div><div id="error"></div><script src="app.js?v=accelerating-2"></script></html>
